name: CI debug
on: push
jobs:
  npmci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: npm ci
        run: |
          set +e
          npm -v
          npm ci > ci.log 2>&1
          code=$?
          msg=$(grep -E "npm (error|ERR)" ci.log | head -15 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::warning title=node ${{ matrix.node }} npm $(npm -v) exit $code::${msg:-ok}"
          exit 0
